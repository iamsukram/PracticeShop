<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Shop - Profile</title>
<style>
:root { --ink:#1b1f2a; --accent:#3b6cf6; --err:#d9363e; --bg:#eef1f7; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); }
header { background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.08); padding:12px 20px; display:flex; align-items:center; gap:16px; }
header .logo { font-weight:700; font-size:20px; flex:1; color:var(--ink); text-decoration:none; }
header .logo span { color:var(--accent); }
header a.cart { color:var(--ink); text-decoration:none; }
header button { padding:8px 12px; border-radius:6px; border:1px solid #c9cfdd; background:#fff; cursor:pointer; }
.badge { background:var(--accent); color:#fff; border-radius:10px; padding:0 7px; font-size:12px; margin-left:4px; }
.page { max-width:720px; margin:24px auto; padding:0 16px; }
.page h2 { margin:0 0 16px; }
.card { background:#fff; border-radius:10px; padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.row { display:flex; align-items:center; gap:12px; }
.row .grow { flex:1; }
.row h3 { margin:0 0 4px; font-size:16px; }
.row p { margin:0; font-size:13px; color:#555; }
.price { font-weight:700; }
.actions { display:flex; gap:12px; justify-content:space-between; margin-top:16px; }
button.primary, .actions button { padding:10px 16px; border:0; border-radius:6px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
button.remove { background:var(--err); color:#fff; border:0; border-radius:6px; padding:8px 12px; cursor:pointer; }
button.ghost { background:#fff !important; color:var(--ink) !important; border:1px solid #c9cfdd !important; }
form.box input { width:100%; padding:12px; margin-bottom:12px; border:1px solid #c9cfdd; border-radius:6px; font-size:15px; }
form.box input.error { border-color: var(--err); }
.error-message { background:var(--err); color:#fff; padding:10px 12px; border-radius:6px; margin-bottom:12px; font-size:14px; display:flex; justify-content:space-between; gap:8px; }
.error-message button { background:transparent; border:0; color:#fff; cursor:pointer; }
.sum { display:flex; justify-content:space-between; padding:4px 0; }
.sum.total { font-weight:700; font-size:18px; border-top:1px solid #dde2ee; margin-top:8px; padding-top:10px; }
.label { font-size:12px; text-transform:uppercase; color:#666; margin-top:12px; }
.done { text-align:center; padding:40px 16px; }
.done .big { font-size:56px; }

</style>
<style>
  .pf label.l { display:block; font-size:13px; margin:12px 0 4px; color:#444; }
  .pf input[type=text], .pf input[type=email], .pf input[type=tel], .pf input[type=number],
  .pf input[type=date], .pf input[type=password], .pf select, .pf textarea {
    width:100%; padding:10px; border:1px solid #c9cfdd; border-radius:6px; font-size:15px; background:#fff; font-family:inherit; }
  .pf input[readonly] { background:#f1f3f8; color:#555; }
  .pf .pw { display:flex; gap:8px; }
  .pf .pw button { padding:0 12px; border:1px solid #c9cfdd; background:#fff; border-radius:6px; cursor:pointer; font-size:18px; }
  .pf .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  .pf .opts { display:flex; gap:16px; flex-wrap:wrap; padding:4px 0; }
  .pf .opts label { display:flex; align-items:center; gap:6px; font-size:15px; }
  .pf .ok { background:#1f9d55; color:#fff; padding:10px 12px; border-radius:6px; margin-bottom:12px; }
  .pf input[type=range] { width:calc(100% - 40px); vertical-align:middle; }
  .pf input[type=color] { width:64px; height:36px; padding:0; border:1px solid #c9cfdd; border-radius:6px; background:#fff; }
  @media (max-width:560px) { .pf .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header id="hdr"></header>
<main class="page">
  <h2>Your profile</h2>
  <form id="profile-form" class="pf card" novalidate>
    <div id="ok-slot"></div>

    <label class="l" for="username">Username</label>
    <input id="username" name="username" data-test="username" type="text" readonly>

    <label class="l" for="password">Password</label>
    <div class="pw">
      <input id="password" name="password" data-test="password" type="password" readonly>
      <button type="button" id="toggle-password" data-test="toggle-password" aria-label="Show password" aria-pressed="false">👁</button>
    </div>

    <div class="grid">
      <div><label class="l" for="first">First name</label><input id="first" name="first" data-test="firstName" type="text" autocomplete="off"></div>
      <div><label class="l" for="last">Last name</label><input id="last" name="last" data-test="lastName" type="text" autocomplete="off"></div>
      <div><label class="l" for="email">Email</label><input id="email" name="email" data-test="email" type="email" autocomplete="off"></div>
      <div><label class="l" for="phone">Phone</label><input id="phone" name="phone" data-test="phone" type="tel" autocomplete="off"></div>
      <div><label class="l" for="age">Age</label><input id="age" name="age" data-test="age" type="number" min="0" max="120"></div>
      <div><label class="l" for="dob">Date of birth</label><input id="dob" name="dob" data-test="dob" type="date"></div>
    </div>

    <label class="l" for="country">Country</label>
    <select id="country" name="country" data-test="country">
      <option value="">Select a country</option>
      <option>Germany</option>
      <option>Japan</option>
      <option>Philippines</option>
      <option>Taiwan</option>
      <option>United States</option>
    </select>

    <label class="l">Preferred contact</label>
    <div class="opts" role="radiogroup" aria-label="Preferred contact">
      <label><input type="radio" name="contact" value="email" data-test="contact-email" checked> Email</label>
      <label><input type="radio" name="contact" value="phone" data-test="contact-phone"> Phone</label>
      <label><input type="radio" name="contact" value="none" data-test="contact-none"> Do not contact</label>
    </div>

    <label class="l">Interests</label>
    <div class="opts">
      <label><input type="checkbox" name="interests" value="hiking" data-test="interest-hiking"> Hiking</label>
      <label><input type="checkbox" name="interests" value="cycling" data-test="interest-cycling"> Cycling</label>
      <label><input type="checkbox" name="interests" value="cooking" data-test="interest-cooking"> Cooking</label>
      <label><input type="checkbox" name="interests" value="gaming" data-test="interest-gaming"> Gaming</label>
    </div>

    <label class="l" for="bio">Bio</label>
    <textarea id="bio" name="bio" data-test="bio" rows="3"></textarea>

    <label class="l" for="rating">Satisfaction (1-10)</label>
    <div><input id="rating" name="rating" data-test="rating" type="range" min="1" max="10" value="5"> <output id="rating-out" for="rating">5</output></div>

    <label class="l" for="color">Favorite color</label>
    <input id="color" name="color" data-test="color" type="color" value="#3b6cf6">

    <div class="opts" style="margin-top:12px">
      <label><input type="checkbox" name="news" data-test="newsletter"> Send me the newsletter</label>
    </div>

    <div class="actions">
      <button type="button" id="cancel" data-test="cancel" class="ghost">Back to products</button>
      <button type="submit" id="save" data-test="save">Save</button>
    </div>
  </form>
</main>

<script>
/* Login rules for the practice store. Pure logic + tiny session helpers. */
(function (root) {
  var PASSWORD = 'secret_sauce';
  var USERS = [
    'standard_user',          // works normally
    'locked_out_user',        // always rejected: locked out
    'problem_user',           // logs in, UI misbehaves (broken images, sort does nothing)
    'performance_glitch_user',// logs in, but slowly
    'error_user',             // logs in, "remove" button does nothing
    'visual_user'             // logs in, layout glitches
  ];
  var MSG = {
    userRequired: 'Epic sadface: Username is required',
    passRequired: 'Epic sadface: Password is required',
    mismatch: 'Epic sadface: Username and password do not match any user in this service',
    locked: 'Epic sadface: Sorry, this user has been locked out.',
    needLogin: function (path) { return "Epic sadface: You can only access '" + path + "' when you are logged in."; }
  };
  var KEY = 'session-username';

  function attemptLogin(username, password) {
    if (!username) return { ok: false, error: MSG.userRequired };
    if (!password) return { ok: false, error: MSG.passRequired };
    if (USERS.indexOf(username) === -1 || password !== PASSWORD) return { ok: false, error: MSG.mismatch };
    if (username === 'locked_out_user') return { ok: false, error: MSG.locked };
    return { ok: true, user: username };
  }

  // cookie (like the real site) + localStorage fallback so it also works from file://
  function setSession(user) {
    try { localStorage.setItem(KEY, user); } catch (e) {}
    try { document.cookie = KEY + '=' + encodeURIComponent(user) + '; path=/'; } catch (e) {}
  }
  function getSession() {
    try { var v = localStorage.getItem(KEY); if (v) return v; } catch (e) {}
    try {
      var m = document.cookie.match(new RegExp('(?:^|; )' + KEY + '=([^;]*)'));
      if (m) return decodeURIComponent(m[1]);
    } catch (e) {}
    return null;
  }
  function clearSession() {
    try { localStorage.removeItem(KEY); localStorage.removeItem('cart-contents'); localStorage.removeItem('checkout-info'); } catch (e) {}
    try { document.cookie = KEY + '=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT'; } catch (e) {}
  }

  var api = {
    PASSWORD: PASSWORD, USERS: USERS, MSG: MSG,
    attemptLogin: attemptLogin, setSession: setSession, getSession: getSession, clearSession: clearSession
  };
  root.Auth = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Shared shop helpers: products, cart, login guard, header. Needs auth.js loaded first. */
(function (root) {
  var PRODUCTS = [
    { id:'backpack', name:'Trail Backpack', price:29.99, emoji:'🎒', desc:'Roomy pack with a padded laptop sleeve.' },
    { id:'light',    name:'Bike Light',     price:9.99,  emoji:'💡', desc:'Bright LED, three modes, USB rechargeable.' },
    { id:'tee',      name:'Logo T-Shirt',   price:15.99, emoji:'👕', desc:'Soft cotton tee in storm blue.' },
    { id:'jacket',   name:'Fleece Jacket',  price:49.99, emoji:'🧥', desc:'Warm half-zip fleece for cold mornings.' },
    { id:'onesie',   name:'Baby Onesie',    price:7.99,  emoji:'👶', desc:'Snap-bottom onesie, machine washable.' },
    { id:'redtee',   name:'Red Tee (Test)', price:15.99, emoji:'👚', desc:'Special edition tee, red.' }
  ];
  var TAX_RATE = 0.08;

  function byId(id) { for (var i = 0; i < PRODUCTS.length; i++) if (PRODUCTS[i].id === id) return PRODUCTS[i]; return null; }
  function loadCart() {
    try { var c = JSON.parse(localStorage.getItem('cart-contents') || '[]'); return Array.isArray(c) ? c : []; } catch (e) { return []; }
  }
  function saveCart(c) { try { localStorage.setItem('cart-contents', JSON.stringify(c)); } catch (e) {} }
  function loadInfo() { try { return JSON.parse(localStorage.getItem('checkout-info') || 'null'); } catch (e) { return null; } }
  function saveInfo(i) { try { localStorage.setItem('checkout-info', JSON.stringify(i)); } catch (e) {} }
  function money(n) { return '$' + n.toFixed(2); }
  function totals(cart) {
    var sub = 0; cart.forEach(function (id) { var p = byId(id); if (p) sub += p.price; });
    sub = Math.round(sub * 100) / 100;
    var tax = Math.round(sub * TAX_RATE * 100) / 100;
    return { sub: sub, tax: tax, total: Math.round((sub + tax) * 100) / 100 };
  }

  // guard: no session -> login page with "must be logged in" message for this path
  function requireUser() {
    var u = root.Auth.getSession();
    if (!u) {
      var page = location.pathname.split('/').pop() || 'index.html';
      location.replace('index.html?needlogin=' + encodeURIComponent('/' + page));
      throw new Error('not logged in');
    }
    return u;
  }

  function mountHeader(el, cartCount) {
    el.innerHTML =
      '<a class="logo" href="inventory.html">Practice<span>Shop</span></a>' +
      '<a class="cart" href="cart.html" data-test="cart-link">Cart<span class="badge" data-test="cart-count">' + cartCount + '</span></a>' +
      '<button id="logout" data-test="logout">Logout</button>';
    el.querySelector('#logout').addEventListener('click', function () {
      root.Auth.clearSession();
      location.href = 'index.html';
    });
  }

  function errorBox(slot, msg, inputs) {
    slot.innerHTML = '';
    var box = document.createElement('div'); box.className = 'error-message'; box.setAttribute('data-test', 'error');
    var t = document.createElement('span'); t.textContent = msg;
    var x = document.createElement('button'); x.type = 'button'; x.textContent = '×';
    x.onclick = function () { slot.innerHTML = ''; (inputs || []).forEach(function (i) { i.classList.remove('error'); }); };
    box.appendChild(t); box.appendChild(x); slot.appendChild(box);
  }

  var api = { PRODUCTS: PRODUCTS, byId: byId, loadCart: loadCart, saveCart: saveCart, loadInfo: loadInfo, saveInfo: saveInfo,
              money: money, totals: totals, requireUser: requireUser, mountHeader: mountHeader, errorBox: errorBox };
  root.Shop = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
  var user = Shop.requireUser();
  Shop.mountHeader(document.getElementById('hdr'), Shop.loadCart().length);

  var form = document.getElementById('profile-form');
  var KEY = 'profile-' + user;
  var TEXT = ['first', 'last', 'email', 'phone', 'age', 'dob', 'country', 'bio', 'rating', 'color'];

  // username = who logged in; password is the shared one, hidden until the eye is clicked
  form.elements.username.value = user;
  form.elements.password.value = Auth.PASSWORD;
  var pw = form.elements.password, eye = document.getElementById('toggle-password');
  eye.addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.textContent = show ? '🙈' : '👁';
    eye.setAttribute('aria-pressed', String(show));
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  var rating = form.elements.rating, out = document.getElementById('rating-out');
  rating.addEventListener('input', function () { out.textContent = rating.value; });

  function collect() {
    var d = {};
    TEXT.forEach(function (k) { d[k] = form.elements[k].value; });
    var c = form.querySelector('input[name=contact]:checked');
    d.contact = c ? c.value : '';
    d.interests = [].map.call(form.querySelectorAll('input[name=interests]:checked'), function (i) { return i.value; });
    d.news = form.elements.news.checked;
    return d;
  }
  function fill(d) {
    TEXT.forEach(function (k) { if (d[k] !== undefined) form.elements[k].value = d[k]; });
    out.textContent = rating.value;
    [].forEach.call(form.querySelectorAll('input[name=contact]'), function (r) { r.checked = r.value === d.contact; });
    [].forEach.call(form.querySelectorAll('input[name=interests]'), function (i) { i.checked = (d.interests || []).indexOf(i.value) !== -1; });
    form.elements.news.checked = !!d.news;
  }

  try { var saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved) fill(saved); } catch (e) {}

  document.getElementById('cancel').onclick = function () { location.href = 'inventory.html'; };
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    try { localStorage.setItem(KEY, JSON.stringify(collect())); } catch (x) {}
    var ok = document.getElementById('ok-slot');
    ok.innerHTML = '<div class="ok" data-test="saved">Profile saved</div>';
  });
</script>
</body>
</html>
